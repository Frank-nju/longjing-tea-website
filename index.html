    <header>
        <section class="hero">
            <h1>西湖龙井</h1>
            <h2>产地 · 时间 · 手工</h2>

        <section class="quote">

                <p>“茶是心灵的寄托，一杯西湖龙井让人回到那片山水之间。”</p>
