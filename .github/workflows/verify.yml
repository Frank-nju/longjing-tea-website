name: Verify Engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify

  browser:
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run render:frame -- --time=42 --out=artifacts/frame-42.png
      - uses: actions/upload-artifact@v4
        with:
          name: frame-42
          path: |
            artifacts/frame-42.png
            artifacts/frame-42.json
