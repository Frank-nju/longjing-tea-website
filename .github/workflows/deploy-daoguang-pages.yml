name: Deploy Daoguang Film to GitHub Pages

on:
  push:
    branches:
      - feat/daoguang-history-film
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the film branch
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Daoguang player
        run: pnpm --filter @efe/daoguang-viewer build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the player
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/daoguang/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
