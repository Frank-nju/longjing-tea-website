name: Package Daoguang interactive site

on:
  push:
    branches:
      - feat/daoguang-interactive-offline-package
    paths:
      - .github/workflows/package-daoguang-interactive.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: Frank-nju/Frank-nju.github.io
          ref: d0f6168776e333fc59bb9ac157a2b6a6b921d696
          path: source-site
          persist-credentials: false
      - name: Build and commit the offline package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/site release
          git -C source-site archive HEAD | tar -x -C package/site
          cat > package/README-先看我.txt <<'EOF'
          道光皇帝模拟器｜多步交互网页版（离线包）

          Windows：双击「一键运行.bat」，浏览器会自动打开网站。
          macOS：双击「一键运行.command」。若系统拦截，请在终端运行：bash 一键运行.sh
          Linux：在终端运行：bash 一键运行.sh

          Mac/Linux 需要安装 Python 3；Windows 使用系统自带 PowerShell。
          运行时请保持启动窗口开启，关闭窗口即可停止本地服务。网站资源全部随包提供，无需联网。
          建议使用较新的 Chrome、Edge、Firefox 或 Safari。

          本包来自 Frank-nju/Frank-nju.github.io 的静态站点快照；
          页面及多步交互原样保留，启动器仅在本机提供静态文件服务，不会修改线上网站。
          EOF
          cat > package/一键运行.bat <<'EOF'
          @echo off
          chcp 65001 >nul
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0启动.ps1"
          EOF
          cat > package/启动.ps1 <<'EOF'
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PSScriptRoot 'site'
          $listener = New-Object System.Net.HttpListener
          $port = 8765
          while ($port -lt 8790) {
            try {
              $listener.Prefixes.Clear()
              $listener.Prefixes.Add("http://127.0.0.1:$port/")
              $listener.Start()
              break
            } catch { $port++ }
          }
          if (-not $listener.IsListening) { Write-Host '无法找到可用端口。'; Read-Host '按回车退出'; exit 1 }
          $url = "http://127.0.0.1:$port/"
          Start-Process $url
          Write-Host "网站已打开：$url"
          Write-Host '保持此窗口开启；按 Ctrl+C 停止网站。'
          $mime = @{ '.html'='text/html; charset=utf-8'; '.js'='application/javascript; charset=utf-8'; '.css'='text/css; charset=utf-8'; '.json'='application/json; charset=utf-8'; '.txt'='text/plain; charset=utf-8'; '.svg'='image/svg+xml'; '.png'='image/png'; '.jpg'='image/jpeg'; '.jpeg'='image/jpeg'; '.webp'='image/webp'; '.avif'='image/avif'; '.woff'='font/woff'; '.woff2'='font/woff2'; '.ico'='image/x-icon' }
          try {
            while ($listener.IsListening) {
              $ctx = $listener.GetContext()
              try {
                $relative = [Uri]::UnescapeDataString($ctx.Request.Url.AbsolutePath.TrimStart('/')).Replace('/', [IO.Path]::DirectorySeparatorChar)
                if ([string]::IsNullOrWhiteSpace($relative)) { $relative = 'index.html' }
                $file = [IO.Path]::GetFullPath((Join-Path $root $relative))
                $rootPath = [IO.Path]::GetFullPath($root).TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
                if (-not $file.StartsWith($rootPath, [StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  $ctx.Response.StatusCode = 404
                  $ctx.Response.Close()
                  continue
                }
                $bytes = [IO.File]::ReadAllBytes($file)
                $ext = [IO.Path]::GetExtension($file).ToLowerInvariant()
                if ($mime.ContainsKey($ext)) { $ctx.Response.ContentType = $mime[$ext] } else { $ctx.Response.ContentType = 'application/octet-stream' }
                $ctx.Response.ContentLength64 = $bytes.Length
                $ctx.Response.OutputStream.Write($bytes, 0, $bytes.Length)
                $ctx.Response.Close()
              } catch { try { $ctx.Response.StatusCode = 500; $ctx.Response.Close() } catch {} }
            }
          } finally { $listener.Stop(); $listener.Close() }
          EOF
          cat > package/一键运行.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          PORT=8765
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory site &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT INT TERM
          sleep 1
          URL="http://127.0.0.1:$PORT/"
          if command -v open >/dev/null 2>&1; then open "$URL"; elif command -v xdg-open >/dev/null 2>&1; then xdg-open "$URL" >/dev/null 2>&1 || true; fi
          echo "网站已打开：$URL。保持此窗口开启，按 Ctrl+C 停止。"
          wait "$SERVER_PID"
          EOF
          cp package/一键运行.sh package/一键运行.command
          chmod +x package/一键运行.sh package/一键运行.command
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src = Path("package")
          out = Path("release/daoguang-interactive-site-offline.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(src.rglob("*")):
                  if path.is_file():
                      archive.write(path, Path("道光皇帝模拟器离线版") / path.relative_to(src))
          print(f"created {out}: {out.stat().st_size} bytes")
          PY
          git add release/daoguang-interactive-site-offline.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add offline Daoguang interactive site package"
          git push origin HEAD:"${GITHUB_REF_NAME}"
